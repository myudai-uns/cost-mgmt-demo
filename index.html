const calcPackage = (p) => {
  const partsSales = p.parts.reduce((s,x)=>s + x.salesEx*x.qty, 0);
  const partsCost  = p.parts.reduce((s,x)=>s + (itemById(x.itemId)?.costEx||0)*x.qty, 0);
  const laborSales = p.labor.reduce((s,x)=>s + x.salesEx, 0);
  const laborCost  = p.labor.reduce((s,x)=>s + x.costEx, 0);
  const listSum    = partsSales + laborSales;            // 単品合計（定価）
  const discount   = listSum - p.packagePrice;           // バンドル割引額
  const cost       = partsCost + laborCost;              // 原価合計
  const gross      = p.packagePrice - cost;              // 想定粗利
  const rate       = p.packagePrice ? gross / p.packagePrice : 0;
  const count      = p.parts.reduce((s,x)=>s+x.qty,0);
  return { partsSales, partsCost, laborSales, laborCost, listSum, discount, cost, gross, rate, count };
};

function calcCase(c) {
  let salesTaxable = 0, salesNonTaxable = 0;
  let costTaxable = 0, costNonTaxable = 0;
  let salesIncTotal = 0;
  for (const l of c.items) {
    const sales = (l.salesEx || 0) * (l.qty || 0);
    const cost = (l.costEx || 0) * (l.qty || 0);
    const tax = taxCategories.find(t => t.id === l.taxId);
    const taxable = tax?.taxable;
    if (taxable) {
      salesTaxable += sales;
      costTaxable += cost;
      salesIncTotal += sales * (1 + (tax?.rate || 0));
    } else {
      salesNonTaxable += sales;
      costNonTaxable += cost;
      salesIncTotal += sales;
    }
  }
  const salesEx = salesTaxable + salesNonTaxable;
  const costTotal = costTaxable + costNonTaxable;
  const gp = salesEx - costTotal;
  const gpRate = salesEx === 0 ? 0 : gp / salesEx;
  return { salesEx, salesIncTotal, salesTaxable, salesNonTaxable, costTaxable, costNonTaxable, costTotal, gp, gpRate };
}

function PartsList() {
  const [selected, setSelected] = useState(null);
  const [filterReorder, setFilterReorder] = useState(false);
  const [filterLongTerm, setFilterLongTerm] = useState(false);
  const [filterUnalloc, setFilterUnalloc] = useState(false);

  let list = items.filter(i => i.type === "parts");
  const today = new Date("2026-05-08");

  const enriched = list.map(i => {
    const e = partsExtra[i.id] || {};
    const avail = i.onHand - i.allocated;
    const days = Math.floor((today - new Date(i.lastUse)) / 86400000);
    const isLongTerm = days >= 180;
    const needsOrder = e.reorderPoint > 0 && (avail + (e.onOrder || 0)) <= e.reorderPoint;
    return { i, e, avail, days, isLongTerm, needsOrder };
  });

  const filtered = enriched.filter(({ e, isLongTerm, needsOrder, i }) => {
    if (filterReorder && !needsOrder) return false;
    if (filterLongTerm && !isLongTerm) return false;
    if (filterUnalloc && i.allocated > 0) return false;
    return true;
  });

  const totalValue = enriched.reduce((a,x) => a + x.i.onHand * x.i.costEx, 0);
  const allocCount = enriched.reduce((a,x) => a + x.i.allocated, 0);
  const onOrderCount = enriched.reduce((a,x) => a + (x.e.onOrder || 0), 0);
  const longTermCount = enriched.filter(x => x.isLongTerm).length;
  const reorderNeeded = enriched.filter(x => x.needsOrder).length;

  return (
    <div className="p-6 space-y-4">
      <div className="grid grid-cols-5 gap-3">
        <StatCard label="パーツ在庫金額(税抜)" value={yen(totalValue)} sub={`${enriched.length} 品目`} subColor="ink" />
        <StatCard label="引当中" value={`${allocCount} 個`} sub="案件確保済" subColor="indigo" />
        <StatCard label="発注中" value={`${onOrderCount} 個`} sub="入荷待ち" subColor="amber" />
        <StatCard label="長期在庫" value={`${longTermCount} 品目`} sub="180日以上未動" subColor="amber" />
        <StatCard label="発注必要" value={`${reorderNeeded} 品目`} sub="発注点割れ" subColor={reorderNeeded > 0 ? "rose" : "ink"} />
      </div>

      <Card>
        <div className="px-4 py-2.5 border-b border-ink-200 flex items-center gap-2 flex-wrap">
          <select className="border border-ink-200 rounded px-2 py-1 text-[12px] bg-white">
            <option>カテゴリ：すべて</option>
          </select>
          <select className="border border-ink-200 rounded px-2 py-1 text-[12px] bg-white">
            <option>仕入先：すべて</option>
            {suppliers.map(s => <option key={s.id}>{s.name}</option>)}
          </select>
          <select className="border border-ink-200 rounded px-2 py-1 text-[12px] bg-white">
            <option>保管場所：すべて</option>
            {locations.map(l => <option key={l.id}>{l.name}</option>)}
          </select>
          <label className="text-[12px] flex items-center gap-1 text-ink-700"><input type="checkbox" className="rounded" checked={filterReorder} onChange={e => setFilterReorder(e.target.checked)} /> 発注必要のみ</label>
          <label className="text-[12px] flex items-center gap-1 text-ink-700"><input type="checkbox" className="rounded" checked={filterLongTerm} onChange={e => setFilterLongTerm(e.target.checked)} /> 長期在庫のみ</label>
          <label className="text-[12px] flex items-center gap-1 text-ink-700"><input type="checkbox" className="rounded" checked={filterUnalloc} onChange={e => setFilterUnalloc(e.target.checked)} /> 未引当のみ</label>
          <div className="flex-1"></div>
          <span className="text-[11px] text-ink-500">{filtered.length} 件</span>
          <button className="text-[12px] text-ink-700 border border-ink-200 px-3 py-1 rounded hover:bg-ink-50">＋ 仕入登録</button>
          <button className="text-[12px] bg-brand-600 hover:bg-brand-700 text-white px-3 py-1 rounded">＋ 発注書作成</button>
        </div>
        <div className="overflow-x-auto scroll-thin">
        <table className="w-full text-[13px]">
          <thead className="text-[11px] text-ink-500 bg-ink-50 border-b border-ink-200">
            <tr>
              <th className="text-left py-2 px-4 font-medium">商品名</th>
              <th className="text-left font-medium">型番</th>
              <th className="text-left font-medium">仕入先</th>
              <th className="text-left font-medium">保管場所</th>
              <th className="text-right font-medium">原価(税抜)</th>
              <th className="text-right font-medium">在庫</th>
              <th className="text-right font-medium">引当</th>
              <th className="text-right font-medium">利用可</th>
              <th className="text-right font-medium">発注中</th>
              <th className="text-right font-medium">発注点</th>
              <th className="text-left font-medium">予約案件</th>
              <th className="text-left font-medium pr-4">状態</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-ink-100">
            {filtered.map(({ i, e, avail, isLongTerm, needsOrder }) => (
              <tr key={i.id} className="hover:bg-brand-50/40 cursor-pointer" onClick={() => setSelected(i)}>
                <td className="py-2 px-4 text-ink-800 font-medium">{i.name}{i.isAssembly && <Pill className="bg-violet-50 text-violet-700 border-violet-100 ml-1.5">組立</Pill>}</td>
                <td className="text-[11px] font-mono text-ink-700">{i.model}</td>
                <td className="text-[12px] text-ink-700">{supName(i.supplier)}</td>
                <td className="text-[12px] text-ink-700">{locName(i.loc)}</td>
                <td className="text-right num text-ink-700">{yen(i.costEx)}</td>
                <td className="text-right num font-semibold text-ink-900">{i.onHand}</td>
                <td className="text-right num text-indigo-700">{i.allocated}</td>
                <td className={`text-right num ${avail === 0 ? "text-rose-600" : "text-emerald-700"}`}>{avail}</td>
                <td className={`text-right num ${(e.onOrder || 0) > 0 ? "text-amber-700" : "text-ink-300"}`}>{e.onOrder || "−"}</td>
                <td className="text-right num text-ink-500">{e.reorderPoint || "−"}</td>
                <td className="text-[11px]">
                  {e.reservedCases?.length > 0 ? (
                    <span className="font-mono text-brand-700">{e.reservedCases.map(cid => cases.find(c => c.id === cid)?.code).filter(Boolean).join(", ")}</span>
                  ) : <span className="text-ink-300">−</span>}
                </td>
                <td className="pr-4 space-x-1 whitespace-nowrap">
                  {needsOrder && <Pill className="bg-rose-50 text-rose-700 border-rose-100">発注必要</Pill>}
                  {isLongTerm && <Pill className="bg-amber-50 text-amber-700 border-amber-100">長期</Pill>}
                  {avail === 0 && !needsOrder && <Pill className="bg-ink-100 text-ink-600 border-ink-200">在庫切</Pill>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        </div>
      </Card>

      {selected && <PartsDetailDrawer item={selected} onClose={() => setSelected(null)} />}
    </div>
  );
}

function Stocktaking() {
  const lines = items.slice(0, 8).map((it,i) => {

        <div className="space-y-4">
          {guideFlows.map(fl => (
            <Card key={fl.title} title={fl.title}>
              <ol className="p-5 space-y-2 text-[12.5px] text-ink-700">
                {fl.steps.map((s,i) => (
                  <li key={i} className="flex gap-3">
                    <span className="w-5 h-5 rounded-full bg-brand-50 text-brand-700 border border-brand-100 flex items-center justify-center text-[11px] flex-shrink-0 font-semibold">{i+1}</span>
                    <span className="leading-relaxed">{s.replace(/^\d+\.\s*/, "")}</span>
                  </li>
                ))}
              </ol>
            </Card>
          ))}
        </div>
      )}

      {tab === "formulas" && (
        <Card title="計算式（明細・案件・在庫）">
          <GuideTable headers={["項目","式 / Bubble表現"]}>
            {guideFormulas.map(f => (
              <tr key={f.name} className="hover:bg-ink-50/70 align-top">
                <td className="py-2 pl-4 text-[12px] text-ink-800 font-semibold whitespace-nowrap w-[28%]">{f.name}</td>
                <td className="py-2 pr-4 text-[12px] text-ink-700 font-mono">{f.expr}</td>
              </tr>
            ))}
          </GuideTable>
        </Card>
      )}

      {tab === "perms" && (
        <div className="space-y-4">
          <Card title="権限マトリクス（UserRole）">
            <GuideTable headers={["Role","表示名","主な権限"]}>
              {guidePerms.map(([k,n,d]) => (
                <tr key={k} className="hover:bg-ink-50/70 align-top">
                  <td className="py-2 pl-4 font-mono text-[12px] text-brand-700 font-semibold">{k}</td>
                  <td className="py-2 text-[12px] text-ink-800 whitespace-nowrap">{n}</td>
                  <td className="py-2 pr-4 text-[12px] text-ink-700 leading-relaxed">{d}</td>
                </tr>
              ))}
            </GuideTable>
          </Card>

          <Card title="Privacy Rules 推奨">
            <ul className="p-5 text-[12.5px] text-ink-700 leading-relaxed space-y-2 list-disc list-inside">
              <li>VehicleCase：Current user's role is admin OR Current user's role is sales OR This VehicleCase's sales_person = Current User → view/modify を許可</li>
              <li>VehicleCaseItem：vehicle_case の Privacy を継承。case_status=closed かつ Current user's role ≠ admin → modify 不可</li>
              <li>InventoryTransaction：type=adjustment は Current user's role が inventory_admin/admin のみ作成可</li>
              <li>StocktakingSession の承認（status=approved/posted への変更）は inventory_admin/admin のみ</li>
              <li>マスタ（Item/Supplier/TaxCategory/StorageLocation）の create/modify は admin のみ、view は全員許可</li>
              <li>User.role の変更は admin のみ。一般ユーザーは自分のレコードのみ閲覧</li>
            </ul>
          </Card>
        </div>
      )}

      {tab === "seed" && (
        <div className="space-y-4">
          <Card title="初期データ（Seed）">
            <ul className="p-5 text-[12.5px] text-ink-700 leading-relaxed space-y-1.5 list-disc list-inside">
              {guideSeed.map((s,i) => <li key={i}>{s}</li>)}
            </ul>
          </Card>
          <Card title="受入テストシナリオ">
            <GuideTable headers={["#","シナリオ","期待動作"]}>
              {guideTests.map(([n,d],i) => (
                <tr key={i} className="hover:bg-ink-50/70 align-top">
                  <td className="py-2 pl-4 text-[12px] text-ink-500 num">{i+1}</td>
                  <td className="py-2 text-[12px] text-ink-800 font-semibold whitespace-nowrap">{n}</td>
                  <td className="py-2 pr-4 text-[12px] text-ink-700 leading-relaxed">{d}</td>
                </tr>
              ))}
            </GuideTable>
          </Card>
          <Card title="作成順序（Bubble Editor 推奨）">
            <ol className="p-5 text-[12.5px] text-ink-700 leading-relaxed space-y-1.5 list-decimal list-inside">
              <li>Option Sets を全件登録（CaseStatus, LineType 等 11個）</li>
              <li>Data Type を作成（マスタ系 → 業務系 → 集計系の順）。フィールドは参照先が先に存在するよう順序に注意</li>
              <li>Privacy Rules を最初に設定（後付けは事故の元）</li>
              <li>マスタ画面 → 在庫一覧 → 入出庫 → 案件一覧 → 案件詳細 → 棚卸 → 月次集計 → ダッシュボード の順で実装</li>
              <li>Backend Workflows：在庫更新、案件集計、月次締めを順に実装</li>
              <li>Privacy/権限の総点検 → 受入テスト → 本番投入</li>
            </ol>
          </Card>
        </div>
      )}

      {tab === "changes" && (
        <div className="space-y-4">
          <Card title="変更管理プロセス">
            <div className="p-5 text-[12.5px] text-ink-700 leading-relaxed space-y-2">
              <p><strong className="text-ink-900">原則：モックを正本(Source of Truth)とし、変更は一方向に流す。</strong></p>
              <ol className="list-decimal list-inside space-y-1 pl-1">
                <li>顧客から要望受領 → 営業がここに新規行を追加（status=requested）</li>
                <li>影響範囲（画面・Data Type・WF・権限）を検討、優先度を確定（status=reviewing）</li>
                <li>社内・顧客承認 → status=approved。<strong className="text-rose-700">承認後にモック側UI と「実装ガイド」該当タブを必ず同期更新</strong>（mockUpdated/guideUpdated を yes に）</li>
                <li>業務委託先へ指示書（instruction）と差分を発注 → status=in_progress</li>
                <li>納品物を顧客検収 → status=uat → 検収完了で status=done、acceptedAt を記録</li>
                <li>仕様外/差し戻し → status=rejected、理由を remarks に</li>
              </ol>
              <p className="text-rose-700 font-semibold mt-2">⚠ モックを更新しない変更は受けない。Bubbleへの直接指示は禁止（モック化石化を防ぐ）。</p>
            </div>
          </Card>

          <Card title={
            <span className="flex items-baseline gap-2">
              <span>変更履歴</span>
              <span className="text-[11px] text-ink-500 font-normal">{guideChanges.length} 件</span>
            </span>
          } action={<button className="text-[12px] bg-brand-600 hover:bg-brand-700 text-white px-3 py-1 rounded">＋ 変更要望を追加</button>}>
            <GuideTable headers={["要望ID","日付","優先","顧客 / 起票者","変更概要","影響","担当 / 期日","状態"]}>
              {guideChanges.map(ch => (
                <tr key={ch.id} className="hover:bg-ink-50/70 align-top">
                  <td className="py-2.5 pl-4 font-mono text-[11px] text-brand-700 font-semibold whitespace-nowrap">{ch.id}</td>
                  <td className="py-2.5 text-[11px] text-ink-700 whitespace-nowrap">{ch.date}</td>
                  <td className="py-2.5"><Pill className={changePriorityColor[ch.priority]}>{ch.priority === "high" ? "高" : ch.priority === "mid" ? "中" : "低"}</Pill></td>
                  <td className="py-2.5 text-[11px]">
                    <div className="text-ink-800">{ch.customer}</div>
                    <div className="text-ink-500 mt-0.5">{ch.requestedBy}</div>
                  </td>
                  <td className="py-2.5 text-[12px] text-ink-800 leading-relaxed">
                    <div>{ch.summary}</div>
                    <div className="text-[10.5px] text-ink-500 mt-1 leading-relaxed border-l-2 border-ink-200 pl-2">
                      <span className="text-ink-400">指示：</span>{ch.instruction}
                    </div>
                    <div className="text-[10.5px] mt-1.5 flex gap-1.5">
                      <span className={ch.mockUpdated ? "text-emerald-700" : "text-rose-600"}>{ch.mockUpdated ? "✓" : "✗"} モック</span>
                      <span className={ch.guideUpdated ? "text-emerald-700" : "text-rose-600"}>{ch.guideUpdated ? "✓" : "✗"} ガイド</span>
                    </div>
                  </td>
                  <td className="py-2.5 text-[10.5px]">
                    <div className="space-y-0.5">
                      {ch.impactScreens.map(s => <Pill key={s} className="bg-brand-50 text-brand-700 border-brand-100 font-mono">{s}</Pill>)}
                      {ch.impactDataTypes.map(d => <Pill key={d} className="bg-blue-50 text-blue-700 border-blue-100 font-mono">{d}</Pill>)}
                    </div>
                  </td>
                  <td className="py-2.5 text-[11px]">
                    <div className="text-ink-800">{ch.assignedTo}</div>
                    <div className="text-ink-500 mt-0.5">期日 {ch.dueDate}</div>
                    {ch.acceptedAt && <div className="text-emerald-700 mt-0.5">検収 {ch.acceptedAt}</div>}
                  </td>
                  <td className="py-2.5 pr-4"><Pill className={changeStatusColor[ch.status]}>{changeStatusLabel[ch.status]}</Pill></td>
                </tr>
              ))}
            </GuideTable>
          </Card>

          <Card title="新規追加テンプレ（要望受領時のコピペ用）">
            <pre className="p-5 text-[11.5px] text-ink-700 font-mono whitespace-pre overflow-x-auto scroll-thin leading-relaxed">
{`{
  id: "CR-YYYY-###",        // 連番採番
  date: "YYYY-MM-DD",       // 要望受領日
  customer: "",             // 顧客名 or 全社（運用要望）
  requestedBy: "",          // 起票者（自社内）
  priority: "high|mid|low",
  summary: "",              // 1〜2行で要望概要
  impactScreens: [],        // 影響画面 key（dashboard/cases/case-detail/parts 等）
  impactDataTypes: [],      // 影響Data Type名（VehicleCase 等）
  instruction: "",          // 業務委託先への具体指示（変更箇所・追加フィールド・条件式）
  mockUpdated: false,       // モックUI更新済か
  guideUpdated: false,      // 実装ガイド該当タブ更新済か
  assignedTo: "",           // 委託先名 or 担当者
  dueDate: "YYYY-MM-DD",
  status: "requested",      // requested → reviewing → approved → in_progress → uat → done
  acceptedAt: "",           // 検収完了日
}`}
            </pre>
          </Card>

          <Card title="運用ルール">
            <ul className="p-5 text-[12.5px] text-ink-700 leading-relaxed space-y-1.5 list-disc list-inside">
              <li><strong>軽微変更（文言・色・並び順）</strong>もここに記録する（後で「いつ誰が言った」の参照点になる）</li>
              <li><strong>状態の自動遷移は無し</strong>。手で更新（変更管理が雑になると一気に崩れるため）</li>
              <li><strong>影響Data Typeに追加・削除がある変更</strong>は、DB設計タブの該当Data Typeも同時に更新する</li>
              <li><strong>requested から approved まで5営業日</strong>を社内SLAとする（顧客への返答スピード基準）</li>
              <li><strong>done 後の手戻り</strong>は新規CR起票（同じIDを再オープンしない）</li>
              <li><strong>顧客承認のエビデンス</strong>はメール/Slackリンクを remarks に貼る（必要なら別タブ「証跡」追加可）</li>
            </ul>
          </Card>
        </div>
      )}
    </div>
  );
}

// ===== Root App =====
function App() {
  const [page, setPage] = useState("dashboard");
  const [caseId, setCaseId] = useState("c1");

  const titles = {
    dashboard: { t:"ダッシュボード", s:"案件・在庫・粗利の全体俯瞰", b:["ホーム","ダッシュボード"] },
    cases: { t:"案件一覧", s:"車両カスタム・販売・整備案件", b:["ホーム","運用","案件一覧"] },
    "case-detail": { t:"車両1台別カスタム積算", s:"見積・原価・在庫引当・粗利を1画面で管理", b:["ホーム","案件一覧","案件詳細"] },
    parts: { t:"パーツ在庫", s:"案件紐付け・引当・長期在庫管理", b:["ホーム","在庫","パーツ"] },
    consumables: { t:"消耗品在庫", s:"発注点アラート付き", b:["ホーム","在庫","消耗品"] },
    transactions: { t:"入出庫履歴", s:"在庫差異調査の中核", b:["ホーム","在庫","入出庫"] },
    stocktaking: { t:"棚卸", s:"月末セッション・差異理由・承認", b:["ホーム","在庫","棚卸"] },
    monthly: { t:"月次集計", s:"在庫金額・長期在庫率・目標差", b:["ホーム","集計","月次"] },
    profit: { t:"案件別粗利", s:"課税/非課税原価分解", b:["ホーム","集計","粗利"] },
    packages: { t:"パッケージ管理", s:"組み合わせ販売・バンドル割引・想定粗利", b:["ホーム","設定","パッケージ"] },
    masters: { t:"マスタ管理", s:"商品・仕入先・保管場所・税区分", b:["ホーム","設定","マスタ"] },
    guide: { t:"実装ガイド", s:"Bubble実装向け：DB設計・画面ロジック・業務フロー", b:["ホーム","ドキュメント","実装ガイド"] },
  };
  const m = titles[page];

  return (
    <div className="flex min-h-screen">
      <Sidebar page={page} setPage={setPage} />
      <main className="flex-1 min-w-0 flex flex-col">
        <Topbar title={m.t} sub={m.s} breadcrumb={m.b} />
        <div className="flex-1 overflow-auto">
          {page === "dashboard" && <Dashboard setPage={setPage} setCaseId={setCaseId} />}
          {page === "cases" && <CasesList setPage={setPage} setCaseId={setCaseId} />}
          {page === "case-detail" && <CaseDetail caseId={caseId} setCaseId={setCaseId} />}
          {page === "parts" && <PartsList />}
          {page === "consumables" && <ConsumablesList />}
          {page === "transactions" && <Transactions />}
          {page === "stocktaking" && <Stocktaking />}
          {page === "monthly" && <Monthly />}
          {page === "profit" && <ProfitView />}
          {page === "packages" && <PackagesMaster />}
          {page === "masters" && <Masters />}
          {page === "guide" && <ImplGuide />}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
